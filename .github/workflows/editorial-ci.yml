name: Editorial CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate editorial content
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check editorial branch scope
        if: startsWith(github.head_ref, 'editorial/')
        env:
          EDITORIAL_SCOPE_ENFORCE: "true"
          EDITORIAL_BASE_REF: ${{ github.base_ref }}
        run: npm run editorial:scope

      - name: Validate content, duplicates and local assets
        run: npm run editorial:validate

      - name: Generate editorial knowledge index
        run: npm run editorial:inventory

      - name: Build site
        run: npm run build

      - name: Check generated internal links
        run: npm run editorial:links

      - name: Verify essential generated pages
        shell: bash
        run: |
          required=(
            "dist/index.html"
            "dist/risorse/index.html"
            "dist/pubblicazioni/index.html"
            "dist/didattica/index.html"
            "dist/interviste/index.html"
            "dist/contatti/index.html"
            "dist/sitemap-index.xml"
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ -f "$file" ]]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          exit "$missing"

      - name: Upload generated site and editorial reports
        uses: actions/upload-artifact@v4
        with:
          name: editorial-validation-artifacts
          path: |
            dist
            artifacts/editorial
          retention-days: 7
