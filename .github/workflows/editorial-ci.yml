name: Editorial CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build Astro site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify essential generated pages
        shell: bash
        run: |
          required=(
            "dist/index.html"
            "dist/risorse/index.html"
            "dist/pubblicazioni/index.html"
            "dist/didattica/index.html"
            "dist/interviste/index.html"
            "dist/contatti/index.html"
            "dist/sitemap-index.xml"
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ -f "$file" ]]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          exit "$missing"

      - name: Upload generated site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: editorial-preview-dist
          path: dist
          retention-days: 7
